      code:
        type: string
      is_filter:
        type: boolean
      is_required:
        type: boolean
      name:
        type: string
      store_id:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/models.AttributeType'
        enum:
        - text
        - number
        - bool
        - select
      unit:
        type: string
    required:
    - code
    - name
    - store_id
    - type
    type: object
  product.CreateProductAttributeValueRequest:
    properties:
      option_id:
        type: string
      product_attribute_id:
        type: string
      value_bool:
        type: boolean
      value_number:
        type: number
      value_text:
        type: string
    required:
