    - inactive
    - blocked
    type: string
    x-enum-varnames:
    - ProductStatusDraft
    - ProductStatusActive
    - ProductStatusInactive
    - ProductStatusBlocked
  models.Role:
    enum:
    - admin
    - seller
    - client
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleSeller
    - RoleClient
  models.StoreStatus:
    enum:
    - active
    - inactive
    - blocked
    - moderation
    type: string
    x-enum-varnames:
    - StoreStatusActive
    - StoreStatusInactive
    - StoreStatusBlocked
    - StoreStatusModeration
  models.UserStatus:
    enum:
    - blocked
    - active
    - inactive
    type: string
    x-enum-varnames:
    - UserStatusBlocked
    - UserStatusActive
    - UserStatusInactive
  product.CreateProductAttributeOptionRequest:
    properties:
      position:
        type: integer
      value:
        type: string
    required:
    - value
    type: object
  product.CreateProductAttributeRequest:
    properties:
      category_id:
